name: 'Flow Pull Action'
description: 'Pull the latest version of flow code from Ganymede. This action supports pulling all flows or just a single flow.'
inputs:
  environment:
    description: 'The Ganymede environment to pull from. This value is shown in the URL. For example, if your Ganymede homepage has the URL https://mycompany.ganymede.bio/mycompany-dev/home, you would use mycompany-dev '
    required: true
  ganymede_subdomain:
    description: 'The Ganymede subdomain where the environment is located. If your Ganymede URL is mycompany.ganymede.bio, this would be mycompany'
    required: true
  ganymede_api_token:
    description: 'API token for authenticating with Ganymede'
    required: true
  flow_name:
    description: 'If this field is set, only the specified flow will be pulled. If not set, all flows will be pulled. This is the flow name that is displayed in the URL.'
    required: false
  zip_directory:
    description: 'If this field is set, the flow will be unzipped to the specified directory. If not set, the flow will be unzipped to a directory named as the environment name.'
    required: false
  include_lib_files:
    description: 'If this field is set to true, code in lib/, accessible to all Flows, will be included in the download. Defaults to true.'
    required: false
    default: 'true'
outputs:
  zip_dir:
    description: "The full path to the zip directory where the flow was unzipped."
    value: ${{ steps.extract-files.outputs.ZIP_DIR }}
  head_sha:
    description: "Current HEAD SHA of the main branch at time of pull."
    value: ${{ steps.get_signed_url.outputs.HEAD_SHA }}
runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # Inputs are passed through `env:` and referenced as shell variables (never
    # interpolated as ${{ }} inside run:), so a crafted value cannot be executed
    # on the runner. The query string is built as a local shell variable in this
    # step and the signed URL is passed to the next step via a delimited step
    # output — neither the user-controlled flow_name nor any value is ever written
    # to $GITHUB_ENV, so a newline in an input can't inject env assignments into
    # later steps.
    - name: Make API call to get signed URL
      id: get_signed_url
      shell: bash
      env:
        GANYMEDE_SUBDOMAIN: ${{ inputs.ganymede_subdomain }}
        ENVIRONMENT: ${{ inputs.environment }}
        GANYMEDE_API_TOKEN: ${{ inputs.ganymede_api_token }}
        FLOW_NAME: ${{ inputs.flow_name }}
        INCLUDE_LIB_FILES: ${{ inputs.include_lib_files }}
      run: |
        # Build the query string locally (never persisted across steps).
        QUERY_PARAM=""
        SEPARATOR=""

        if [ -n "$FLOW_NAME" ]; then
          # Reject anything that isn't a plain flow name. The glob checks the
          # WHOLE value (newlines included, unlike line-oriented grep): if any
          # character is outside [A-Za-z0-9._-], fail — so a newline or shell/URL
          # metacharacter can't break out of the query string or poison later
          # steps.
          case "$FLOW_NAME" in
            *[!A-Za-z0-9._-]*)
              echo "Error: flow_name contains invalid characters."
              exit 1
              ;;
          esac
          QUERY_PARAM="${QUERY_PARAM}${SEPARATOR}flowName=${FLOW_NAME}"
          SEPARATOR="&"
        fi

        # Always send includeLibFiles explicitly. The API defaults an omitted
        # value to true, so omitting it when the input is false would still
        # download lib files.
        if [ "$INCLUDE_LIB_FILES" = "true" ]; then
          QUERY_PARAM="${QUERY_PARAM}${SEPARATOR}includeLibFiles=true"
        else
          QUERY_PARAM="${QUERY_PARAM}${SEPARATOR}includeLibFiles=false"
        fi

        if [ -n "$QUERY_PARAM" ]; then
          QUERY_PARAM="?$QUERY_PARAM"
        fi

        response=$(curl -w "\n%{http_code}" --location "https://${GANYMEDE_SUBDOMAIN}.ganymede.bio/v2/environment/${ENVIRONMENT}/commits${QUERY_PARAM}" \
              --header "api-key: ${GANYMEDE_API_TOKEN}")
        status_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$ d')

        if [ "$status_code" -ne 200 ]; then
          echo "Error: Received status code $status_code"
          echo "Response: $body"
          exit 1
        fi

        SIGNED_URL=$(echo "$body" | jq -r '.signedUrl')
        HEAD_SHA=$(echo "$body" | jq -r '.headSha')
        # Pass to later steps via delimited step outputs (not $GITHUB_ENV).
        {
          echo "SIGNED_URL<<GANYMEDE_EOF"
          echo "$SIGNED_URL"
          echo "GANYMEDE_EOF"
          echo "HEAD_SHA=$HEAD_SHA"
        } >> $GITHUB_OUTPUT

    - name: Download ZIP file
      shell: bash
      env:
        SIGNED_URL: ${{ steps.get_signed_url.outputs.SIGNED_URL }}
      run: |
        curl -s -L "$SIGNED_URL" -o files.zip
        echo "Downloaded zip file"

    - name: Extract files
      shell: bash
      id: extract-files
      env:
        ZIP_DIRECTORY: ${{ inputs.zip_directory }}
        ENVIRONMENT: ${{ inputs.environment }}
        FLOW_NAME: ${{ inputs.flow_name }}
      run: |
        TARGET_DIR="${ZIP_DIRECTORY:-$ENVIRONMENT}"

        # Create temp directory for extraction
        TEMP_DIR=$(mktemp -d)

        # Extract ZIP to temp directory
        unzip -o -q files.zip -d "$TEMP_DIR"

        # Create target directory if it doesn't exist
        mkdir -p "$TARGET_DIR"

        if [ -n "$FLOW_NAME" ]; then
          # Single flow mode: Only sync the specified flow (and lib if present)
          for dir in "$TEMP_DIR"/*; do
            if [ -d "$dir" ]; then
              dir_name=$(basename "$dir")
              TARGET_SUBDIR="$TARGET_DIR/$dir_name"
              TEMP_SUBDIR="$TEMP_DIR/$dir_name"

              # If this subdirectory exists in target, clean it up
              if [ -d "$TARGET_SUBDIR" ]; then
                # Save current directory
                ORIGINAL_DIR=$(pwd)
                cd "$TARGET_SUBDIR"

                # Find and remove files that don't exist in temp
                find . -type f | while read -r file; do
                  clean_file="${file#./}"
                  if [ ! -f "$TEMP_SUBDIR/$clean_file" ]; then
                    echo "Removing deleted file: $dir_name/$clean_file"
                    rm "$file"
                  fi
                done

                # Remove empty directories
                find . -type d -empty -delete 2>/dev/null || true

                cd "$ORIGINAL_DIR"
              fi
            fi
          done
        else
          # All flows mode: Sync entire directory
          # First, remove directories and files in target that don't exist in temp
          if [ -d "$TARGET_DIR" ]; then
            ORIGINAL_DIR=$(pwd)
            cd "$TARGET_DIR"

            # Remove entire flow directories that don't exist in the new download
            find . -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
              dir_name=$(basename "$dir")
              if [ ! -d "$TEMP_DIR/$dir_name" ]; then
                echo "Removing deleted flow directory: $dir_name"
                rm -rf "$dir_name"
              fi
            done

            # Find all remaining files in target and remove those not in temp
            find . -type f | while read -r file; do
              clean_file="${file#./}"
              if [ ! -f "$TEMP_DIR/$clean_file" ]; then
                echo "Removing deleted file: $clean_file"
                rm "$file"
              fi
            done

            # Remove empty directories
            find . -type d -empty -delete 2>/dev/null || true

            cd "$ORIGINAL_DIR"
          fi
        fi

        # Copy all extracted files to target (overwrites existing)
        cp -r "$TEMP_DIR"/* "$TARGET_DIR"/

        # Clean up
        rm -rf "$TEMP_DIR"
        rm files.zip

        # Get the full path of the zip directory for output
        ZIP_DIR=$(realpath "$TARGET_DIR")
        echo "ZIP_DIR=${ZIP_DIR}" >> $GITHUB_OUTPUT
